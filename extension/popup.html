<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font-family:Inter,Segoe UI,sans-serif;width:440px;margin:0;color:#202123;background:#fff}.head{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid #e5e5e2}.brand{display:flex;gap:9px;align-items:center}.mark{width:29px;height:29px;border-radius:8px;background:#111;color:#fff;display:grid;place-items:center;font-weight:700}.title b{display:block;font-size:13px}.title span{font-size:10px;color:#777}.status{font-size:11px}.ok{color:#137333}.bad{color:#b42318}.controls{padding:11px 15px;border-bottom:1px solid #eee}.row{display:flex;align-items:center;justify-content:space-between;font-size:12px}.toggle{width:38px;height:22px;border-radius:20px;background:#ccc;padding:2px;cursor:pointer}.toggle i{display:block;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}.toggle.on{background:#111}.toggle.on i{transform:translateX(16px)}button{border:1px solid #d9d9d5;background:#fff;border-radius:7px;padding:7px 10px;font-size:11px;cursor:pointer}.primary{background:#111;color:#fff;border-color:#111}.actions{display:flex;gap:7px;margin-top:10px}.media{max-height:280px;overflow:auto}.label{padding:10px 15px 6px;font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.05em}.item{padding:9px 15px;border-top:1px solid #f0f0ed;display:flex;gap:8px;align-items:center}.txt{min-width:0;flex:1}.txt b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txt span{display:block;font-size:9px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.empty{padding:18px 15px;color:#777;font-size:11px;text-align:center}
#selectionControls,.item input[data-select]{display:none}body.selecting #selectionControls{display:flex}body.selecting .item input[data-select]{display:inline-block}.txt b,button,.row,.status{font-size:14px}.txt span,.title span,.label,.empty{font-size:12px}.port{display:flex;align-items:center;gap:8px;margin-top:10px}.port input{width:85px;font:inherit;padding:5px}.actions{flex-wrap:wrap}</style></head><body><div class="head"><div class="brand"><div class="mark">W</div><div class="title"><b>WDM</b><span>Web Download Manager</span></div></div><div id="status" class="status">Checking…</div></div><div class="controls"><div class="row"><span>Capture browser downloads</span><div id="toggle" class="toggle"><i></i></div></div><div class="port"><label for="port">Desktop port</label><input id="port" type="number" min="1024" max="65535" value="3021"><button id="savePort">Save port</button></div><div class="actions"><button id="open" class="primary">Open WDM</button><button id="refresh">Refresh page links</button><button id="selection" aria-pressed="false">Select links</button></div></div><div class="controls"><div id="selectionControls" class="row"><label><input id="all" type="checkbox"> Select all links</label><button id="sendSelected" class="primary">Queue selected</button></div><p id="message" style="font-size:11px;line-height:1.4;overflow-wrap:anywhere" role="status"></p></div><div class="label">Detected video, HLS &amp; page links</div><div id="media" class="media"><div class="empty">Scanning…</div></div><script src="popup.js"></script></body></html>
